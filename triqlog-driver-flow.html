<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>TriqLog — Driver QR Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root {
  --bg:#0B0D14;--bg2:#101318;--bg3:#151820;
  --surface:#1A1D28;--surface2:#20243A;--surface3:#272C42;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --amber:#F0B429;--amber2:#FFD166;--amber-dim:rgba(240,180,41,0.13);--amber-glow:rgba(240,180,41,0.06);
  --green:#22C55E;--green2:#4ADE80;--green-dim:rgba(34,197,94,0.12);
  --red:#EF4444;--red-dim:rgba(239,68,68,0.11);
  --blue:#60A5FA;--blue-dim:rgba(96,165,250,0.10);
  --teal:#2DD4BF;--teal-dim:rgba(45,212,191,0.10);
  --text:#EEF0FA;--text2:#8891AE;--text3:#454C6A;
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

html, body {
  height: 100%;
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

/* ── Phone shell ── */
.phone {
  width: 390px;
  height: 844px;
  margin: 16px auto;
  background: var(--bg);
  border-radius: 44px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 32px 80px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.08);
}
@media (max-width: 430px) {
  html, body { overflow: auto; }
  .phone { width:100%; height:auto; min-height:100vh; border-radius:0; margin:0; box-shadow:none; }
}

/* ── Status bar ── */
.sbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 24px 6px;
  font-size: 12px; font-weight: 700;
  background: var(--bg);
  position: sticky; top: 0; z-index: 30;
}
.sbar-time { font-size: 15px; font-weight: 800; }
.sbar-icons { display:flex; gap:5px; align-items:center; font-size:12px; }

/* ── Scroll area ── */
.scroll {
  height: calc(844px - 70px);
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
  padding-bottom: 80px;
}
@media (max-width:430px) { .scroll { height: auto; min-height: calc(100vh - 70px); } }

/* ── Bottom nav ── */
.bnav {
  position: absolute; bottom:0; left:0; right:0;
  height: 70px;
  background: var(--bg2); border-top: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 4px 14px;
}
.nt {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding: 8px 2px; cursor:pointer; border:none; background:none; border-radius:10px;
}
.nt-ico { font-size:20px; }
.nt-lbl { font-size:9px; font-weight:700; color:var(--text3); }
.nt.active .nt-lbl { color:var(--amber); }
.nb {
  position:absolute; top:4px; right: calc(50% - 18px);
  width:15px; height:15px; border-radius:50%;
  background:var(--red); color:#fff; font-size:8px; font-weight:800;
  display:flex; align-items:center; justify-content:center;
  border: 2px solid var(--bg2);
}

/* ── Screens ── */
.scr { display:none; animation: fadeUp .22s ease; }
.scr.active { display:block; }
@keyframes fadeUp { from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);} }

/* ── Section header inside phone ── */
.ph { display:flex; justify-content:space-between; align-items:center; padding:14px 16px 8px; }
.ph-title { font-size:12px; font-weight:800; color:var(--text3); text-transform:uppercase; letter-spacing:.8px; font-family:'IBM Plex Mono',monospace; }
.ph-link  { font-size:12px; font-weight:700; color:var(--amber); cursor:pointer; }

/* ── Driver hero card ── */
.driver-hero {
  margin: 12px;
  background: linear-gradient(135deg,#151A08,#1E2510);
  border: 1px solid rgba(240,180,41,0.25);
  border-radius: 16px; padding:18px;
  position:relative; overflow:hidden;
}
.driver-hero::before { content:'🚛'; position:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:42px; opacity:.09; }
.dh-tier { display:inline-flex; align-items:center; gap:5px; background:var(--amber-dim); border:1px solid rgba(240,180,41,0.3); border-radius:100px; padding:3px 12px; font-size:9px; font-weight:800; color:var(--amber); font-family:'IBM Plex Mono',monospace; margin-bottom:8px; }
.dh-name { font-size:18px; font-weight:900; margin-bottom:3px; }
.dh-sub  { font-size:11px; color:var(--text3); }

/* ── Trip card ── */
.trip-card {
  margin: 0 12px 10px;
  background: var(--surface); border:1px solid var(--border);
  border-radius:16px; overflow:hidden;
}
.tc-head {
  display:flex; align-items:center; gap:10px;
  padding:12px 14px; background:var(--surface2); border-bottom:1px solid var(--border);
}
.tc-badge { background:var(--amber); color:#0A0700; border-radius:100px; padding:3px 12px; font-size:9px; font-weight:800; font-family:'IBM Plex Mono',monospace; }
.tc-lot   { font-size:11px; color:var(--text3); font-family:'IBM Plex Mono',monospace; }
.tc-body  { padding:14px; }
.tc-route { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.tc-city  { font-size:16px; font-weight:800; }
.tc-arr   { color:var(--amber); font-size:16px; }
.tc-chips { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px; }
.chip     { background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:100px; padding:3px 10px; font-size:11px; color:var(--text2); }

/* ── Payment strip ── */
.pay-strip {
  display:flex; border-top:1px solid var(--border);
}
.ps-cell { flex:1; padding:10px 8px; text-align:center; border-right:1px solid var(--border); }
.ps-cell:last-child { border-right:none; }
.ps-lbl { font-size:8px; color:var(--text3); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; }
.ps-val { font-size:14px; font-weight:900; }
.ps-when { font-size:9px; color:var(--text3); margin-top:2px; }

/* ── Progress milestones ── */
.progress-section { margin:0 12px 10px; }
.prog-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:11px; color:var(--text3); font-family:'IBM Plex Mono',monospace; }
.prog-track {
  position:relative; height:60px;
}
.prog-line {
  position:absolute; top:19px; left:20px; right:20px;
  height:3px; background:rgba(255,255,255,0.07); border-radius:2px; z-index:0;
}
.prog-fill {
  height:100%; border-radius:2px;
  background:linear-gradient(90deg,var(--green),var(--amber));
  transition: width .6s ease;
}
.milestones { position:relative; display:flex; justify-content:space-between; }
.milestone  { display:flex; flex-direction:column; align-items:center; gap:4px; }
.m-circle {
  width:38px; height:38px; border-radius:50%; z-index:1;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:900; border:2px solid var(--border2);
  background:var(--surface2); transition:all .4s;
}
.m-circle.done   { background:var(--green);  border-color:var(--green);  color:#021008; font-size:16px; box-shadow:0 0 14px rgba(34,197,94,.4); }
.m-circle.active { background:var(--amber);  border-color:var(--amber);  color:#0A0700; box-shadow:0 0 14px rgba(240,180,41,.5); animation:mPulse 1.8s ease-in-out infinite; }
.m-circle.locked { background:var(--surface3); border-color:var(--border); color:var(--text3); }
@keyframes mPulse { 0%,100%{box-shadow:0 0 14px rgba(240,180,41,.4);}50%{box-shadow:0 0 22px rgba(240,180,41,.8),0 0 0 6px rgba(240,180,41,.1);} }
.m-label { font-size:9px; color:var(--text3); font-family:'IBM Plex Mono',monospace; text-align:center; max-width:56px; }
.m-amount{ font-size:10px; font-weight:800; }

/* ── BIG ACTION BUTTON ── */
.action-btn {
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:calc(100% - 24px); margin:0 12px 10px;
  padding:18px; border-radius:14px; border:none; cursor:pointer;
  font-family:'Outfit',sans-serif; font-size:16px; font-weight:900;
  transition:all .2s; position:relative; overflow:hidden;
}
.action-btn:active { transform:scale(.97); }
.action-btn.green-btn  { background:linear-gradient(135deg,var(--green),#16A34A); color:#021008; box-shadow:0 6px 20px rgba(34,197,94,.3); }
.action-btn.amber-btn  { background:linear-gradient(135deg,var(--amber),#C07A10);  color:#0A0600; box-shadow:0 6px 20px rgba(240,180,41,.3); }
.action-btn.grey-btn   { background:rgba(255,255,255,.05); color:var(--text3); border:1px solid var(--border); cursor:not-allowed; box-shadow:none; }
.action-btn.teal-btn   { background:linear-gradient(135deg,var(--teal),#1A9E8A); color:#021410; box-shadow:0 6px 20px rgba(45,212,191,.3); }
.action-btn .btn-icon  { font-size:22px; }

/* ── COUNTDOWN WIDGET ── */
.countdown-widget {
  margin:0 12px 10px;
  background:var(--amber-glow); border:1px solid rgba(240,180,41,.2);
  border-radius:14px; padding:14px 16px;
  display:flex; align-items:center; gap:14px;
}
.cd-coin { font-size:36px; animation:cdBob 1.6s ease-in-out infinite; }
@keyframes cdBob { 0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);} }
.cd-body { flex:1; }
.cd-title { font-size:12px; font-weight:800; color:var(--amber); margin-bottom:3px; }
.cd-sub   { font-size:11px; color:var(--text2); }
.cd-time  {
  font-size:22px; font-weight:900; color:var(--amber);
  font-family:'IBM Plex Mono',monospace; letter-spacing:2px;
  white-space:nowrap;
}
.cd-bar-wrap { height:4px; background:rgba(255,255,255,.07); border-radius:2px; overflow:hidden; margin-top:8px; }
.cd-bar { height:100%; background:linear-gradient(90deg,var(--amber),var(--amber2)); border-radius:2px; transition:width .5s ease; }

/* ── INFO NOTES ── */
.info-note {
  margin:0 12px 10px; padding:11px 13px;
  border-radius:10px; display:flex; align-items:flex-start; gap:9px;
  font-size:12px; line-height:1.55;
}
.info-note.amber { background:var(--amber-glow); border:1px solid rgba(240,180,41,.18); }
.info-note.green { background:var(--green-dim);  border:1px solid rgba(34,197,94,.18); }
.info-note.blue  { background:var(--blue-dim);   border:1px solid rgba(96,165,250,.18); }
.in-ico { font-size:17px; flex-shrink:0; }
.in-txt { color:var(--text2); }
.in-txt strong { color:var(--text); }

/* ══════════════════════════════
   QR MODAL OVERLAY
══════════════════════════════ */
.qr-modal-overlay {
  position:absolute; inset:0;
  background:rgba(0,0,0,0); backdrop-filter:blur(0px);
  z-index:100; display:flex; align-items:flex-end;
  pointer-events:none;
  transition:background .3s, backdrop-filter .3s;
}
.qr-modal-overlay.open {
  background:rgba(0,0,0,0.75); backdrop-filter:blur(8px);
  pointer-events:all;
}

.qr-sheet {
  width:100%; background:var(--bg2);
  border-radius:28px 28px 0 0;
  padding:0 0 32px;
  transform:translateY(100%);
  transition:transform .38s cubic-bezier(0.32,0.72,0,1);
  overflow:hidden;
}
.qr-modal-overlay.open .qr-sheet {
  transform:translateY(0);
}

/* Sheet handle */
.qr-handle { width:38px; height:4px; background:rgba(255,255,255,.2); border-radius:2px; margin:12px auto 0; }

/* Sheet header */
.qr-sheet-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px 12px;
}
.qsh-left {}
.qsh-type { font-size:13px; font-weight:900; margin-bottom:3px; }
.qsh-sub  { font-size:11px; color:var(--text3); font-family:'IBM Plex Mono',monospace; }
.qsh-close {
  width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.08);
  border:none; color:var(--text2); font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.qsh-close:active { background:rgba(255,255,255,.15); }

/* QR display area */
.qr-display-area {
  display:flex; flex-direction:column; align-items:center; padding:16px 20px 0;
}

/* QR "reveal" animation */
.qr-reveal {
  position:relative;
  opacity:0; transform:scale(.9);
  transition:opacity .35s .05s, transform .35s .05s cubic-bezier(.17,.67,.35,1.2);
}
.qr-modal-overlay.open .qr-reveal {
  opacity:1; transform:scale(1);
}

.qr-frame {
  background:white; border-radius:16px; padding:14px;
  box-shadow:0 8px 40px rgba(0,0,0,.6);
  position:relative;
}
.qr-frame img { width:220px; height:220px; display:block; }

/* Animated corner brackets */
.qr-bracket {
  position:absolute; width:22px; height:22px;
  transition:all .3s .1s;
}
.qr-bracket.tl { top:6px;    left:6px;   border-top:3px solid var(--amber); border-left:3px solid var(--amber); }
.qr-bracket.tr { top:6px;    right:6px;  border-top:3px solid var(--amber); border-right:3px solid var(--amber); }
.qr-bracket.bl { bottom:6px; left:6px;   border-bottom:3px solid var(--amber); border-left:3px solid var(--amber); }
.qr-bracket.br { bottom:6px; right:6px;  border-bottom:3px solid var(--amber); border-right:3px solid var(--amber); }
.qr-frame.green-frame .qr-bracket { border-color:var(--green) !important; }

/* Scan line animation */
.qr-scanline {
  position:absolute; left:14px; right:14px; height:2px;
  background:linear-gradient(90deg, transparent, var(--amber), transparent);
  animation:scanDown 2s ease-in-out infinite;
  box-shadow:0 0 8px var(--amber);
}
.qr-frame.green-frame .qr-scanline {
  background:linear-gradient(90deg,transparent,var(--green),transparent);
  box-shadow:0 0 8px var(--green);
}
@keyframes scanDown { 0%{top:14px;opacity:0;}10%{opacity:1;}90%{opacity:1;}100%{top:calc(100% - 18px);opacity:0;} }

/* QR info below image */
.qr-info {
  margin-top:16px; text-align:center; width:100%;
}
.qr-lot  { font-size:16px; font-weight:900; color:var(--text); margin-bottom:4px; }
.qr-desc { font-size:12px; color:var(--text2); margin-bottom:12px; line-height:1.5; }
.qr-sig  { font-size:10px; font-family:'IBM Plex Mono',monospace; color:var(--text3); background:rgba(255,255,255,.04); border-radius:8px; padding:6px 10px; word-break:break-all; }

/* Verify status */
.qr-verify-status {
  width:100%; margin:12px 0 0; padding:12px 14px;
  border-radius:10px; display:flex; align-items:center; gap:10px;
  font-size:13px; font-weight:700;
  transition:all .3s;
  background:rgba(255,255,255,.04); border:1px solid var(--border);
}
.qr-verify-status.valid   { background:var(--green-dim); border-color:rgba(34,197,94,.25); color:var(--green); }
.qr-verify-status.invalid { background:var(--red-dim);   border-color:rgba(239,68,68,.2);  color:var(--red); }
.qv-icon { font-size:20px; }

/* Confirm button inside modal */
.qr-confirm-btn {
  width:100%; margin-top:14px; padding:15px;
  border-radius:12px; border:none; cursor:pointer;
  font-family:'Outfit',sans-serif; font-size:15px; font-weight:900;
  transition:all .2s;
}
.qr-confirm-btn:active { transform:scale(.97); }
.qr-confirm-btn.green { background:linear-gradient(135deg,var(--green),#16A34A); color:#021008; box-shadow:0 4px 16px rgba(34,197,94,.3); }
.qr-confirm-btn.amber { background:linear-gradient(135deg,var(--amber),#C07A10);  color:#0A0700; box-shadow:0 4px 16px rgba(240,180,41,.3); }
.qr-confirm-btn.disabled { background:rgba(255,255,255,.06); color:var(--text3); cursor:not-allowed; box-shadow:none; }

/* Sheet padding sides */
.sheet-pad { padding:0 20px; }

/* ── Toast ── */
.toast {
  position:absolute; bottom:82px; left:12px; right:12px; z-index:200;
  background:var(--surface2); border:1px solid var(--border2);
  border-left:3px solid var(--amber); border-radius:12px;
  padding:12px 16px; box-shadow:0 8px 32px rgba(0,0,0,.6);
  transform:translateY(16px); opacity:0; pointer-events:none;
  transition:all .3s ease;
}
.toast.show { transform:translateY(0); opacity:1; }
.toast.green-toast { border-left-color:var(--green); }
.toast-title { font-weight:800; font-size:13px; color:var(--amber); margin-bottom:2px; }
.toast.green-toast .toast-title { color:var(--green); }
.toast-body { font-size:12px; color:var(--text2); }

::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-thumb { background:var(--surface2); border-radius:2px; }
</style>
</head>

  document.querySelectorAll('.sbar-time').forEach(el => el.textContent = t);
}

// ── QR Verification (HMAC-SHA256 via Web Crypto) ──────
const QR_SECRET = 'triqlog-dev-secret-change-in-prod';

async function hmac256(key, message) {
  const enc     = new TextEncoder();
  const keyData = await crypto.subtle.importKey('raw', enc.encode(key), { name:'HMAC', hash:'SHA-256' }, false, ['sign']);
  const sig     = await crypto.subtle.sign('HMAC', keyData, enc.encode(message));
  return Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2,'0')).join('').slice(0, 32);
}

async function verifyQRPayload(qrString, expectedType) {
  try {
    const data = JSON.parse(qrString);
    const required = ['shipmentId','lotNumber','type','timestamp','sig'];
    for (const f of required) {
      if (data[f] == null) return { valid: false, reason: 'Champ manquant: ' + f };
    }
    const { sig, ...rest } = data;
    const expected = await hmac256(QR_SECRET, JSON.stringify(rest));
    if (sig !== expected) return { valid: false, reason: 'Signature invalide — QR falsifié' };
    const maxAge = data.type === 'ORIGIN' ? 48 * 3600000 : 7 * 24 * 3600000;
    if (Date.now() - data.timestamp > maxAge) return { valid: false, reason: 'QR expiré' };
    if (data.type !== expectedType) return { valid: false, reason: 'Mauvais type: ' + data.type };
    return { valid: true, data };
  } catch (e) {
    return { valid: false, reason: 'Format invalide' };
  }
}

// ── Toast ─────────────────────────────────────────────
let toastTimer = null;
function showToast(title, body, type = 'amber') {
  const el = document.getElementById('toast');
  el.querySelector('.toast-title').textContent = title;
  el.querySelector('.toast-body').textContent  = body;
  el.className = 'toast show' + (type === 'green' ? ' green-toast' : '');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 4000);
  // Haptic (Android)
  if (navigator.vibrate) navigator.vibrate(type === 'green' ? [60, 30, 60] : [80]);
}

// ── Navigation ────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.scr').forEach(s => s.classList.remove('active'));
  document.getElementById('scr-' + id).classList.add('active');
  document.querySelectorAll('.nt').forEach(t => t.classList.remove('active'));
  const tab = document.getElementById('nt-' + id);
  if (tab) tab.classList.add('active');
  document.querySelector('.scroll').scrollTop = 0;
}

// ── QR MODAL ─────────────────────────────────────────
let qrModalType = null;   // 'ORIGIN' | 'DESTINATION'
let qrVerified  = false;

function openQRModal(type) {
  qrModalType = type;
  qrVerified  = false;

  const overlay = document.getElementById('qrOverlay');
  const frame   = document.getElementById('qrFrame');
  const img     = document.getElementById('qrImg');
  const title   = document.getElementById('qshType');
  const sub     = document.getElementById('qshSub');
  const desc    = document.getElementById('qrDesc');
  const verEl   = document.getElementById('qrVerifyStatus');
  const confBtn = document.getElementById('qrConfirmBtn');

  // Set content based on type
  if (type === 'ORIGIN') {
    img.src          = QR_ORIGIN_URL;
    title.textContent = '📍 QR Prise en charge';
    sub.textContent   = 'Faites scanner par le chargeur au départ';
    desc.textContent  = 'LOT-8821 · Béni Mellal — présentez ce code au chargeur pour confirmer le départ.';
    frame.classList.remove('green-frame');
    confBtn.textContent = '✓ Confirmer le scan';
    confBtn.className   = 'qr-confirm-btn amber disabled';
  } else {
    img.src          = QR_DEST_URL;
    title.textContent = '🏁 QR Livraison';
    sub.textContent   = 'Faites scanner par le destinataire à l\'arrivée';
    desc.textContent  = 'LOT-8821 · Casablanca ZI — présentez ce code au destinataire pour confirmer la livraison.';
    frame.classList.add('green-frame');
    confBtn.textContent = '✓ Confirmer la livraison';
    confBtn.className   = 'qr-confirm-btn green disabled';
  }

  // Show sig preview
  const payload = type === 'ORIGIN' ? QR_ORIGIN_PAYLOAD : QR_DEST_PAYLOAD;
  const parsed  = JSON.parse(payload);
  document.getElementById('qrSig').textContent = 'sig: ' + parsed.sig;

  // Reset verify status
  verEl.className   = 'qr-verify-status';
  verEl.innerHTML   = '<span class="qv-icon">⏳</span> Vérification HMAC en cours…';
  confBtn.disabled  = true;

  // Open modal
  overlay.classList.add('open');

  // Auto-verify after short delay (simulates scan)
  setTimeout(() => autoVerify(type, payload, verEl, confBtn), 800);
}

async function autoVerify(type, payload, verEl, confBtn) {
  const result = await verifyQRPayload(payload, type);
  if (result.valid) {
    verEl.className = 'qr-verify-status valid';
    verEl.innerHTML = '<span class="qv-icon">✅</span> Signature valide — QR authentique';
    qrVerified = true;
    const btn = document.getElementById('qrConfirmBtn');
    btn.disabled  = false;
    btn.className = btn.className.replace('disabled', type === 'ORIGIN' ? 'amber' : 'green');
  } else {
    verEl.className = 'qr-verify-status invalid';
    verEl.innerHTML = '<span class="qv-icon">❌</span> ' + result.reason;
  }
}

function closeQRModal() {
  document.getElementById('qrOverlay').classList.remove('open');
  qrModalType = null;
  qrVerified  = false;
}

function confirmQRScan() {
  if (!qrVerified) return;
  closeQRModal();

  if (qrModalType === 'ORIGIN') {
    onOriginConfirmed();
  } else if (qrModalType === 'DESTINATION') {
    onDestinationConfirmed();
  }
}

// ── State transitions ─────────────────────────────────

function onOriginConfirmed() {
  shipment.state       = State.PICKED_UP;
  shipment.t1Released  = true;
  renderHome();
  showToast('💰 MAD ' + fmt(shipment.t1) + ' versés !', '50% libéré. Bonne route !', 'green');
  // After brief pause, move to in-transit
  setTimeout(() => { shipment.state = State.IN_TRANSIT; renderHome(); }, 1000);
}

function onDestinationConfirmed() {
  shipment.state       = State.T2_COUNTING;
  shipment.t2HoldStart = Date.now();
  shipment.t2SecsLeft  = 60 * 60;
  renderHome();
  showToast('📍 Arrivée confirmée', 'Minuteur 60 min démarré — MAD ' + fmt(shipment.t2) + ' en attente', 'amber');
  startT2Timer();
}

function startT2Timer() {
  if (shipment.t2Timer) clearInterval(shipment.t2Timer);
  shipment.t2Timer = setInterval(() => {
    shipment.t2SecsLeft--;
    updateCountdown();
    if (shipment.t2SecsLeft <= 0) {
      clearInterval(shipment.t2Timer);
      shipment.state      = State.T2_DONE;
      shipment.t2Released = true;
      renderHome();
      showToast('✅ MAD ' + fmt(shipment.t2) + ' libérés !', '60 min écoulées — Tranche 2 versée', 'green');
      // Start 24h T3 hold
      setTimeout(() => { shipment.state = State.T3_HOLDING; renderHome(); }, 800);
    }
  }, 1000);
}

function updateCountdown() {
  const el = document.getElementById('cdTimer');
  const bar = document.getElementById('cdBar');
  if (!el) return;
  el.textContent = formatTimer(shipment.t2SecsLeft);
  const pct = Math.round(((3600 - shipment.t2SecsLeft) / 3600) * 100);
  if (bar) bar.style.width = pct + '%';
}

function simulateArrival() {
  // GPS simulated arrival for demo — shows the delivery QR button
  shipment.state = State.ARRIVED;
  renderHome();
  showToast('📍 GPS : Arrivée détectée', 'Vous êtes à moins de 500m de la destination', 'amber');
}

// ── Formatters ────────────────────────────────────────
function fmt(n) { return Number(n).toLocaleString('fr-MA'); }
function formatTimer(secs) {
  const h = String(Math.floor(secs / 3600)).padStart(2,'0');
  const m = String(Math.floor((secs % 3600) / 60)).padStart(2,'0');
  const s = String(secs % 60).padStart(2,'0');
  return h + ':' + m + ':' + s;
}

// ── Progress bar width per state ─────────────────────
function getProgressPct(state) {
  const map = {
    [State.PENDING]:     0,
    [State.PICKED_UP]:   33,
    [State.IN_TRANSIT]:  50,
    [State.ARRIVED]:     55,
    [State.T2_COUNTING]: 66,
    [State.T2_DONE]:     85,
    [State.T3_HOLDING]:  90,
    [State.COMPLETE]:    100,
  };
  return map[state] || 0;
}

// ── Milestone state helpers ───────────────────────────
function m1State(s) {
  if ([State.PICKED_UP,State.IN_TRANSIT,State.ARRIVED,State.T2_COUNTING,State.T2_DONE,State.T3_HOLDING,State.COMPLETE].includes(s)) return 'done';
  if (s === State.PENDING) return 'active';
  return 'locked';
}
function m2State(s) {
  if ([State.T2_DONE,State.T3_HOLDING,State.COMPLETE].includes(s)) return 'done';
  if ([State.ARRIVED,State.T2_COUNTING].includes(s)) return 'active';
  return 'locked';
}
function m3State(s) {
  if (s === State.COMPLETE) return 'done';
  if (s === State.T3_HOLDING) return 'active';
  return 'locked';
}

// ── Render home screen ────────────────────────────────
function renderHome() {
  const s     = shipment;
  const state = s.state;

  // ── Status badge text
  const statusMap = {

    [State.PICKED_UP]:   ['PRIS EN CHARGE','#22C55E'],
    [State.IN_TRANSIT]:  ['EN ROUTE',    '#F0B429'],
    [State.ARRIVED]:     ['ARRIVÉ',      '#60A5FA'],
    [State.T2_COUNTING]: ['60 MIN ⏱',   '#F0B429'],
    [State.T2_DONE]:     ['T2 ✓',        '#22C55E'],
    [State.T3_HOLDING]:  ['ATTENTE T3',  '#C084FC'],
    [State.COMPLETE]:    ['TERMINÉ ✓',   '#22C55E'],

  // ── Action button config

  if (state === State.PENDING) {
    actionBtn = `<button class="action-btn amber-btn" onclick="openQRModal('ORIGIN')">
      <span class="btn-icon">📋</span> Confirmer la prise en charge

  } else if (state === State.IN_TRANSIT) {
    actionBtn = `<button class="action-btn grey-btn" onclick="simulateArrival()">
      <span class="btn-icon">🚛</span> En route… (simuler arrivée GPS)
    </button>`;
  } else if (state === State.ARRIVED) {
    actionBtn = `<button class="action-btn green-btn" onclick="openQRModal('DESTINATION')">
      <span class="btn-icon">📋</span> Confirmer la livraison
    </button>`;
  } else if (state === State.T2_COUNTING) {
    actionBtn = `<button class="action-btn grey-btn" disabled>
      <span class="btn-icon">⏳</span> Minuteur en cours…
    </button>`;
  } else if (state === State.T3_HOLDING) {
    actionBtn = `<button class="action-btn teal-btn" onclick="showToast('⚡ Early Release','MAD ${fmt(Math.round(s.t3*0.95))} versés maintenant. Frais 5% = MAD ${fmt(Math.round(s.t3*0.05))}','green')">
      <span class="btn-icon">⚡</span> Early Release — MAD ${fmt(Math.round(s.t3 * 0.95))} (−5%)
    </button>`;
  } else if (state === State.COMPLETE) {
    actionBtn = `<button class="action-btn green-btn" onclick="showToast('🎉 Terminé','Voyage complet. MAD ${fmt(s.net)} net total versé.','green')">
      <span class="btn-icon">🎉</span> Voyage terminé — Voir le reçu
    </button>`;
  } else {
    actionBtn = `<button class="action-btn grey-btn" disabled>
      <span class="btn-icon">⏳</span> En traitement…
    </button>`;
  }

  // ── Milestone classes
  const [mc1,mc2,mc3] = [m1State(state), m2State(state), m3State(state)];
  const m1Icon = mc1==='done'?'✓' : mc1==='active'?'📍':'📍';
  const m2Icon = mc2==='done'?'✓' : mc2==='active'?'⏱':'🏁';

  // ── T2 countdown widget (only when counting)

    countdownHTML = `

      <div class="cd-coin">🪙</div>

        <div class="cd-title">Fenêtre 60 minutes</div>

      </div>
      <div class="cd-time" id="cdTimer">${formatTimer(s.t2SecsLeft)}</div>
    </div>`;
  }

  // ── T3 hold note
  let t3NoteHTML = '';
  if (state === State.T3_HOLDING) {
    t3NoteHTML = `
    <div class="info-note" style="background:rgba(192,132,252,.06);border:1px solid rgba(192,132,252,.18);margin:0 12px 10px;">

  }

  // ── Info note
  let infoHTML = '';
  if (state === State.PENDING) {

  } else if (state === State.ARRIVED) {
    infoHTML = `<div class="info-note green"><span class="in-ico">📍</span><div class="in-txt"><strong>GPS confirme votre arrivée</strong> à moins de 500m de la destination. Appuyez pour afficher le QR de livraison.</div></div>`;
  }

  document.getElementById('homeContent').innerHTML = `
    <div class="driver-hero">
      <div class="dh-tier">⭐ Conducteur Premium</div>
      <div class="dh-name">Hassan Benali 🧔</div>
      <div class="dh-sub">Béni Mellal · 22T · 4.8 ⭐ · 47 voyages</div>
    </div>

    <div class="trip-card">
      <div class="tc-head">
        <div class="tc-badge" style="background:${statusColor};color:${statusColor==='#F0B429'?'#0A0700':'#021008'}">${statusLabel}</div>

      </div>
      <div class="tc-body">
        <div class="tc-route">
          <div class="tc-city">${s.origin}</div>
          <div class="tc-arr">→</div>
          <div class="tc-city">${s.destination}</div>
        </div>
        <div class="tc-chips">
          <div class="chip">🏋️ ${s.weight}</div>
          <div class="chip">📦 ${s.cargo}</div>
          <div class="chip">📅 Auj. 15:00</div>
        </div>
        <div class="pay-strip">

            <div class="ps-lbl">T1 · 50%</div>

            <div class="ps-when">Prise en charge</div>

            <div class="ps-val" style="color:${s.t2Released?'var(--green)':state===State.T2_COUNTING?'var(--amber)':'var(--text2)'}">${s.t2Released?'✓ ':''} MAD ${fmt(s.t2)}</div>
            <div class="ps-when">60 min GPS</div>
          </div>
          <div class="ps-cell">
            <div class="ps-lbl">T3 · 25%</div>
            <div class="ps-val" style="color:${s.t3Released?'var(--green)':state===State.T3_HOLDING?'var(--purple)':'var(--text2)'}">${s.t3Released?'✓ ':''} MAD ${fmt(s.t3)}</div>

    <div class="progress-section">
      <div class="prog-header">

        <span style="color:var(--amber);font-weight:800;">MAD ${fmt(s.net)} net</span>

            <div class="m-amount" style="color:var(--green)">MAD ${fmt(s.t1)}</div>
          </div>
          <div class="milestone">
            <div class="m-circle ${mc2}">${m2Icon}</div>
            <div class="m-label">Livraison + 60 min</div>
            <div class="m-amount" style="color:var(--amber)">MAD ${fmt(s.t2)}</div>
          </div>
          <div class="milestone">
            <div class="m-circle ${mc3}">${m3Icon}</div>
            <div class="m-label">24h / Net30</div>
            <div class="m-amount" style="color:var(--purple)">MAD ${fmt(s.t3)}</div>
          </div>
        </div>
      </div>
    </div>

    ${countdownHTML}
    ${t3NoteHTML}
    ${infoHTML}
    ${actionBtn}
  `;
}
